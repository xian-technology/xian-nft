name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-nft
        uses: actions/checkout@v6
        with:
          path: xian-nft

      - name: Checkout xian-js
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-js
          ref: main
          path: xian-js

      - name: Checkout xian-contracting
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            xian-js/package-lock.json
            xian-nft/package-lock.json

      - name: Install and build xian-js
        working-directory: xian-js
        run: |
          npm ci
          npm run build

      - name: Install xian-nft
        working-directory: xian-nft
        run: |
          npm ci
          npm audit --audit-level=critical --omit=dev

      - name: Typecheck xian-nft
        working-directory: xian-nft
        run: npm run typecheck

      - name: Test xian-nft
        working-directory: xian-nft
        run: npm test

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python dependencies
        working-directory: xian-nft
        run: uv sync --group dev

      - name: Ruff lint
        working-directory: xian-nft
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: xian-nft
        run: uv run ruff format --check .

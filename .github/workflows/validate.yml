name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-nft
        uses: actions/checkout@v7
        with:
          path: xian-nft

      - name: Checkout xian-js
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-js
          ref: main
          path: xian-js

      - name: Checkout xian-contracting
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Check out xian-cli
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-cli
          ref: main
          path: xian-cli

      - name: Check out xian-abci
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-abci
          ref: main
          path: xian-abci

      - name: Check out xian-meta
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-meta
          ref: main
          path: xian-meta

      - name: Checkout xian-py
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-py
          ref: main
          path: xian-py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            xian-js/package-lock.json
            xian-nft/package-lock.json

      - name: Install and build xian-js
        working-directory: xian-js
        run: |
          npm ci
          npm run build

      - name: Install xian-nft
        working-directory: xian-nft
        run: |
          npm ci
          npm audit --audit-level=critical --omit=dev

      - name: Typecheck xian-nft
        working-directory: xian-nft
        run: npm run typecheck

      - name: Test xian-nft
        working-directory: xian-nft
        run: npm test

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Report resolved sibling SHAs
        run: python xian-meta/scripts/report_workspace_shas.py --workspace-root .

      - name: Sync Python dependencies
        working-directory: xian-nft
        run: uv sync --locked --group dev --group deploy

      - name: Ruff lint
        working-directory: xian-nft
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: xian-nft
        run: uv run ruff format --check .

      - name: Test Python contracts and bootstrap
        working-directory: xian-nft
        run: uv run --locked --group deploy pytest -q

      - name: Set up Rust for native checker validation
        uses: dtolnay/rust-toolchain@stable

      - name: Test shipped checker on the native VM
        working-directory: xian-nft
        run: >-
          uv run --locked --group deploy --refresh-package xian-tech-vm-core
          --with ../xian-contracting/packages/xian-vm-core
          pytest -q tests/test_native_checker.py
